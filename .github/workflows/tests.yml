name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q bridge tests diagnose_history.py upgrade_bridge.py
  streamable-http:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
        sdk: ['minimum', 'supported']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[http]'
      - if: matrix.sdk == 'minimum'
        run: python -m pip install 'mcp==1.30.0' 'uvicorn==0.52.1'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q bridge tests diagnose_history.py upgrade_bridge.py
