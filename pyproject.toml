[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vm-codex-mcp-bridge"
version = "0.2.0"
description = "Remote Workspace MCP: read-only workspace files with optional selected Codex history"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
[project.urls]
Repository = "https://github.com/Elainadesne/remote-workspace-mcp"
[project.scripts]
vm-codex-mcp-bridge = "bridge.server:main"
vm-codex-bridge = "bridge.server:main"
[tool.setuptools.packages.find]
include = ["bridge*"]
