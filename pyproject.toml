[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vm-codex-mcp-bridge"
version = "0.3.0"
description = "Read-only remote workspace MCP with optional selected Codex history"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
[project.optional-dependencies]
http = ["mcp>=1.30.0,<2", "uvicorn>=0.52.1,<0.53"]

[project.urls]
Repository = "https://github.com/Elainadesne/vm-codex-mcp-bridge"
[project.scripts]
vm-codex-mcp-bridge = "bridge.server:main"
vm-codex-bridge = "bridge.server:main"
[tool.setuptools.packages.find]
include = ["bridge*"]
